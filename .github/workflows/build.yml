name: Build

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 固定 Swift 版本：Package.swift 要求 tools-version 6.2，
      # 不钉版本时 setup-swift 装到哪个 toolchain 全看它的默认值
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2"

      # make release = make build（arm64 + x86_64，含架构校验）+ zip + sha256
      # 走 Makefile 而不是在这里内联打包，避免本地和 CI 产物不一致
      - name: Build and package
        run: make release

      - name: Show architectures
        run: |
          set -euo pipefail
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          unzip -q build/go2shell.zip -d /tmp/verify
          for bin in /tmp/verify/go2shell.app/Contents/MacOS/go2shell \
                     /tmp/verify/go2shell.app/Contents/PlugIns/go2shellTerminal.appex/Contents/MacOS/go2shellTerminal \
                     /tmp/verify/go2shell.app/Contents/PlugIns/go2shellCopy.appex/Contents/MacOS/go2shellCopy; do
            echo "$(basename "$bin"): $(lipo -archs "$bin")"
          done
          echo "SHA256: $(cat build/go2shell.zip.sha256)"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: |
            build/go2shell.zip
            build/go2shell.zip.sha256

  create-release:
    name: Create Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release-assets/*
          append_body: true
          body: |

            ---

            ## 📦 下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | **macOS (Universal)** | `go2shell.zip` | Apple Silicon (M1/M2/M3/M4) 与 Intel 均为原生 |

            > ⚠️ 应用未经 notarize，首次打开可能被 Gatekeeper 拦截：
            > ```bash
            > xattr -d com.apple.quarantine /Applications/go2shell.app
            > ```
            > 或前往 系统设置 > 隐私与安全性 > 点击"仍要打开"。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
