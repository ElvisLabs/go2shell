name: Update Homebrew Cask

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号 (例如: v1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    env:
      # 跟随当前仓库，fork 后不需要再改（账号改名也会自动跟上）
      TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
      SOURCE_REPO: ${{ github.repository }}
    steps:
      - name: Validate tag
        id: validate-tag
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag }}"
          VERSION="$(printf '%s' "$VERSION" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"

          if [[ -z "$VERSION" ]]; then
            echo "Error: tag input is empty"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: invalid tag format: $VERSION"
            exit 1
          fi

          echo "Using tag: $VERSION"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download checksum
        run: |
          set -euo pipefail
          VERSION="${{ steps.validate-tag.outputs.tag }}"
          BASE_URL="https://github.com/${SOURCE_REPO}/releases/download/${VERSION}"
          curl -fsSL "${BASE_URL}/go2shell.zip.sha256" -o sha256

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.validate-tag.outputs.tag }}"
          VERSION_NUM="${VERSION#v}"

          SHA256=$(tr -d '\n\r' < sha256)

          if [[ ! "$SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Error: invalid checksum: $SHA256"
            exit 1
          fi

          cat > go2shell.rb << CASK_EOF
          cask "go2shell" do
            version "${VERSION_NUM}"
            sha256 "${SHA256}"

            url "https://github.com/${SOURCE_REPO}/releases/download/v#{version}/go2shell.zip"
            name "go2shell"
            desc "Open terminal from Finder toolbar — fork with FinderSync extensions"
            homepage "https://github.com/${SOURCE_REPO}"

            depends_on macos: ">= :sequoia"

            app "go2shell.app"

            caveats do
              <<~EOS
                go2shell is not notarized. On first launch, macOS Gatekeeper may block it.
                To allow it, run:
                  xattr -d com.apple.quarantine /Applications/go2shell.app

                Or go to System Settings > Privacy & Security > click "Open Anyway".

                Then drag /Applications/go2shell.app into any Finder window's toolbar
                while holding ⌘ (Command). You'll also need to enable the two FinderSync
                extensions in System Settings > General > Login Items & Extensions.
              EOS
            end

            zap trash: [
              "~/Library/Preferences/com.solarhell.go2shell.plist",
              "~/Library/Group Containers/group.com.solarhell.go2shell",
            ]
          end
          CASK_EOF

          echo "Generated cask:"
          cat go2shell.rb

          git clone "https://git:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          cp go2shell.rb tap/Casks/go2shell.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/go2shell.rb
          git commit -m "Update go2shell to ${VERSION}" || echo "No changes to commit"
          git push
